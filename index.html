<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAXS Portfolio Manager v3 — An Niêm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1219;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#1a2d6d,#0f1a3e);padding:16px 20px;border-bottom:3px solid #e8601c}
.header-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;max-width:1400px;margin:0 auto}
.logo{font-size:22px;font-weight:800;letter-spacing:1px}.logo span{color:#e8601c}
.logo-sub{color:#94a3b8;font-size:13px;font-weight:400;margin-left:8px}
.subtitle{color:#64748b;font-size:11px;margin-top:2px}
.btn-fetch{background:#e8601c;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer}
.btn-fetch:hover{background:#d45a19}.btn-fetch:disabled{background:#374151;cursor:wait}
.last-fetch{color:#64748b;font-size:10px}
.tabs{display:flex;gap:0;border-bottom:1px solid #1e293b;background:#111827;flex-wrap:wrap}
.tab{padding:10px 20px;font-size:13px;font-weight:400;color:#94a3b8;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer}
.tab.active{color:#e8601c;font-weight:700;border-bottom-color:#e8601c}
.container{padding:16px 20px;max-width:1400px;margin:0 auto}
.grid{display:grid;gap:10px;margin-bottom:16px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.grid-2{grid-template-columns:1fr 1fr}
.card{background:#1e293b;border-radius:10px;padding:14px}
.card-kpi{border-left:4px solid var(--c,#3b82f6)}
.lbl{color:#64748b;font-size:10px;display:block;margin-bottom:2px}
.val{font-size:16px;font-weight:700}.val-sm{font-size:13px;font-weight:700}
.sub{font-size:10px;color:#94a3b8;margin-top:2px}
.green{color:#10b981}.red{color:#ef4444}.orange{color:#e8601c}.blue{color:#3b82f6}.yellow{color:#f59e0b}.purple{color:#8b5cf6}
input,select,textarea{background:#0f172a;border:1px solid #334155;border-radius:6px;color:#fff;padding:6px 8px;width:100%;font-size:12px;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#e8601c;outline:none}
textarea{min-height:60px;resize:vertical}
.coin-card{border-left:4px solid var(--c,#6366f1);margin-bottom:14px}
.coin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.coin-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.cond-section{margin-top:10px;padding:10px;background:#0f172a;border-radius:8px}
.cond-title{font-size:10px;color:#e8601c;font-weight:600;margin-bottom:8px}
.cond-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px}
.cond-row{display:flex;gap:4px;align-items:center}
.cond-badge{border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #334155;background:#1e293b;color:#94a3b8}
.cond-badge.on{background:#065f46;border-color:#10b981;color:#34d399}
.pnl-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.pnl-box{background:#0f172a;border-radius:6px;padding:8px;text-align:center}
.risk-bar{margin-top:8px;padding:8px;background:#450a0a;border-radius:6px;display:flex;justify-content:space-around;font-size:11px;flex-wrap:wrap;gap:4px}
.bar-item{margin-bottom:6px}
.bar-bg{background:#0f172a;border-radius:4px;height:6px}
.bar-fill{border-radius:4px;height:6px;transition:width .3s}
.alloc-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px}
.pnl-list-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #334155}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:6px 8px;text-align:left;color:#64748b;font-weight:600;border-bottom:2px solid #334155}
td{padding:6px 8px;border-bottom:1px solid #1e293b}
.badge{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600}
.badge-spot{background:#065f46;color:#34d399}.badge-future{background:#7c2d12;color:#fbbf24}
.badge-cat{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.btn-add{border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer}
.btn-del{background:#ef4444;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}
.btn-close{background:#f59e0b;color:#000;border:none;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer}
.ok-badge{background:#065f46;color:#34d399;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600}
.empty{color:#64748b;font-size:13px;text-align:center;padding:20px}
.footer{text-align:center;padding:12px 0;border-top:1px solid #1e293b;color:#475569;font-size:10px}
.lesson-card{margin-bottom:12px}
.lesson-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lesson-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.lesson-content{display:flex;flex-direction:column;gap:8px}
.stars{color:#f59e0b;font-size:11px}
.sl-eff{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600}
.sl-good{background:#065f46;color:#34d399}
.sl-bad{background:#7f1d1d;color:#fca5a5}
.sl-wait{background:#374151;color:#9ca3af}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}.coin-fields{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const COINS=["BTC","ETH","SOL","SUI","BNB","INJ","APT","AVAX","TIA","NEAR","TON","TRX","MNT","SEI","ZRO","WLD","BERA","STRK","ZK","XION","XRP","ADA","ATOM","KCS","DOGE","PEPE","LINK","DOT","UNI","OP","ARB"];
const EX=["Binance","OKX","Bybit","Hyperliquid","Coinbase","Bitget","MEXC","Khác"];
const FIBO=["0.236","0.382","0.500","0.618","0.786","0.890","1.000","1.272","1.618","Khác"];
const OT=["Buy Limit","Buy Stop","Sell Limit","Sell Stop","Market Buy","Market Sell"];
const SS=["Chờ mua","Đang giữ","Đã dời về 0","Đã dời về dương","Đã bán"];
const FS=["Chờ lệnh","Đang mở","Đã dời về 0","Đã dời về dương","Đã đóng"];
const LCATS=["Tâm lý","Kỹ thuật","Quản trị vốn","Kỷ luật","Chiến lược"];
const CC=c=>({BTC:"#f7931a",ETH:"#627eea",SUI:"#4da2ff",SOL:"#9945ff",BNB:"#f0b90b",INJ:"#0082ff",XRP:"#00aae4",ADA:"#0033ad",AVAX:"#e84142",NEAR:"#00c08b",TON:"#0098ea",TRX:"#ff0013",APT:"#00bcd4",TIA:"#7b2ff7",SEI:"#9b1d1d",DOGE:"#c2a633",LINK:"#2a5ada",DOT:"#e6007a"}[c]||"#6366f1");
let uid=100;const nid=()=>++uid;
const fmt=(n,d=0)=>{if(n==null||isNaN(n))return"—";return Number(n).toLocaleString("vi-VN",{minimumFractionDigits:d,maximumFractionDigits:d})};
const fU=n=>n==null||isNaN(n)?"—":`$${fmt(n,2)}`,fV=n=>n==null||isNaN(n)?"—":`${fmt(n,0)}₫`,fP=n=>n==null||isNaN(n)?"—":`${n>=0?"+":""}${n.toFixed(2)}%`;
const opts=(arr,sel)=>arr.map(a=>`<option${a===sel?" selected":""}>${a}</option>`).join("");

const CYCLES=[
{name:"Chu kỳ 1",start:"21/11/2011",end:"30/11/2013",bottom:2,peak:1163,gain:58050,note:"Khởi đầu BTC",days:740},
{name:"Chu kỳ 2",start:"14/01/2015",end:"17/12/2017",bottom:152,peak:19783,gain:12915,note:"Altcoin bùng nổ",days:1068},
{name:"Chu kỳ 3",start:"15/12/2018",end:"10/11/2021",bottom:3122,peak:69000,gain:2110,note:"DeFi + NFT",days:1061},
{name:"Chu kỳ 4",start:"21/11/2022",end:"06/10/2025",bottom:15476,peak:109000,gain:604,note:"ETF + AI (đã kết thúc)",days:1050}
];

let state={tab:"dashboard",totalVND:6e9,spotPct:70,rate:25500,p2pRate:0,prices:{},fundingRates:{},loading:false,lastFetch:null,
spots:[{id:nid(),coin:"BTC",ex:"Binance",pct:20,avg:0,qty:0,sell:0,st:"Chờ mua",fibo:"0.618",ot:"Buy Limit",cATH:"",cWeek:"",cWave:"",cSig:"",dATH:0,dWeek:0,dWave:0,dSig:0},
{id:nid(),coin:"SUI",ex:"Binance",pct:50,avg:0,qty:0,sell:0,st:"Chờ mua",fibo:"0.618",ot:"Buy Limit",cATH:"",cWeek:"",cWave:"",cSig:"",dATH:0,dWeek:0,dWave:0,dSig:0},
{id:nid(),coin:"SOL",ex:"Binance",pct:30,avg:0,qty:0,sell:0,st:"Chờ mua",fibo:"0.618",ot:"Buy Limit",cATH:"",cWeek:"",cWave:"",cSig:"",dATH:0,dWeek:0,dWave:0,dSig:0}],
futures:[{id:nid(),coin:"SUI",ex:"Binance",capVND:6e8,lev:3,qty:0,dir:"Long",ot:"Buy Limit",fiboE:"0.786",fiboTP:"1.618",entry:0,sl:0,tp:0,sell:0,slPct:30,liq:0,fund:0,st:"Chờ lệnh",cATH:"",cWave:"",cRev:"",cSig:"",dATH:0,dWave:0,dRev:0,dSig:0},
{id:nid(),coin:"BNB",ex:"Binance",capVND:6e8,lev:3,qty:0,dir:"Long",ot:"Buy Limit",fiboE:"0.786",fiboTP:"1.618",entry:0,sl:0,tp:0,sell:0,slPct:30,liq:0,fund:0,st:"Chờ lệnh",cATH:"",cWave:"",cRev:"",cSig:"",dATH:0,dWave:0,dRev:0,dSig:0},
{id:nid(),coin:"INJ",ex:"Binance",capVND:6e8,lev:3,qty:0,dir:"Long",ot:"Buy Limit",fiboE:"0.786",fiboTP:"1.618",entry:0,sl:0,tp:0,sell:0,slPct:30,liq:0,fund:0,st:"Chờ lệnh",cATH:"",cWave:"",cRev:"",cSig:"",dATH:0,dWave:0,dRev:0,dSig:0}],
history:[],
lessons:[{id:nid(),date:"06/04/2026",coin:"BTC",type:"Spot",cat:"Tâm lý",rating:4,title:"Không đuổi giá khi FOMO",sit:"BTC tăng mạnh 15%",mistake:"Vào lệnh khi chưa đủ 4 điều kiện",lesson:"Luôn kiểm tra đủ 4 điều kiện",action:"Thêm checklist 4 điều kiện"},
{id:nid(),date:"06/04/2026",coin:"SUI",type:"Future",cat:"Kỷ luật",rating:5,title:"Cắt lỗ đúng kế hoạch",sit:"SUI chạm SL 30%",mistake:"Không có sai lầm",lesson:"Kỷ luật cắt lỗ bảo vệ vốn",action:"Tiếp tục tuân thủ SL 30%"}],
equityLog:[]};

async function fetchPrices(){
state.loading=true;render();
try{
const coins=new Set([...state.spots.map(s=>s.coin),...state.futures.map(f=>f.coin)]);
const symbols=[...coins].map(c=>c+"USDT");
const pPromises=symbols.map(s=>fetch(`https://fapi.binance.com/fapi/v2/ticker/price?symbol=${s}`).then(r=>r.json()).then(d=>({symbol:d.symbol,price:parseFloat(d.price)})).catch(()=>null));
const fCoins=new Set(state.futures.map(f=>f.coin));
const fPromises=[...fCoins].map(c=>fetch(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${c}USDT`).then(r=>r.json()).then(d=>({coin:c,rate:parseFloat(d.lastFundingRate)})).catch(()=>null));
const p2pPromise=fetch('https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({asset:"USDT",fiat:"VND",merchantCheck:true,page:1,rows:5,tradeType:"SELL",payTypes:[]})}).then(r=>r.json()).catch(()=>null);
const[pR,fR,p2p]=await Promise.all([Promise.all(pPromises),Promise.all(fPromises),p2pPromise]);
const p={};pR.forEach(r=>{if(r?.symbol&&r.price)p[r.symbol.replace("USDT","")]=r.price});state.prices=p;
const fr={};fR.forEach(r=>{if(r?.coin)fr[r.coin]=r.rate});state.fundingRates=fr;
if(p2p?.data?.length>0){const ps=p2p.data.map(d=>parseFloat(d.adv.price));state.p2pRate=ps.reduce((a,b)=>a+b,0)/ps.length;state.rate=Math.round(state.p2pRate)}
state.lastFetch=new Date().toLocaleTimeString("vi-VN");
const sD=state.spots.map(calcSpot),fD=state.futures.map(calcFut);
const eq=state.totalVND/state.rate+sD.reduce((a,s)=>a+s.pnl,0)+fD.reduce((a,f)=>a+f.pnl,0);
state.equityLog.push({t:Date.now(),v:eq});if(state.equityLog.length>200)state.equityLog=state.equityLog.slice(-200);
}catch(e){console.error(e)}
state.loading=false;render();
}

function calcSpot(s){
const{rate:R,spotPct:SP,totalVND:TV,prices:P}=state;
const spotVND=TV*SP/100,allocVND=spotVND*s.pct/100,allocUSDT=allocVND/R;
const cp=P[s.coin]||0,value=s.qty*cp,cost=s.qty*s.avg;
const pnl=s.st==="Đã bán"&&s.sell>0?s.qty*(s.sell-s.avg):value-cost;
const pnlPct=cost>0?(pnl/cost)*100:0;
return{...s,allocVND,allocUSDT,cp,value,cost,pnl,pnlVND:pnl*R,pnlPct,allC:s.dATH&&s.dWeek&&s.dWave&&s.dSig};
}

function calcFut(f){
const{rate:R,prices:P,fundingRates:FR}=state;
const cp=P[f.coin]||0,capU=f.capVND/R,posSize=capU*f.lev,slAmt=capU*f.slPct/100;
const exitP=f.st==="Đã đóng"&&f.sell>0?f.sell:cp;
const pnl=f.entry>0?(f.qty>0?f.qty*(exitP-f.entry)*(f.dir==="Long"?1:-1):((exitP-f.entry)/f.entry)*posSize*(f.dir==="Long"?1:-1)):0;
const pnlPct=capU>0&&f.entry>0?(pnl/capU)*100:0;
const liq=f.entry>0&&f.lev>0?(f.dir==="Long"?f.entry*(1-.95/f.lev):f.entry*(1+.95/f.lev)):0;
const fundRate=FR[f.coin]||0;
const fundAmt=f.entry>0&&f.qty>0?f.qty*f.entry*fundRate:posSize*fundRate;
const rr=f.entry>0&&f.sl>0&&f.tp>0?Math.abs(f.tp-f.entry)/Math.abs(f.entry-f.sl):0;
let slEff="wait";
if(f.st==="Đã dời về 0"||f.st==="Đã dời về dương")slEff="good";
else if(f.st==="Đã đóng"&&f.sell>0&&f.entry>0){slEff=(f.dir==="Long"?f.sell<=f.sl:f.sell>=f.sl)?"bad":"good"}
return{...f,cp,capU,posSize,slAmt,pnl,pnlVND:pnl*R,pnlPct,calcLiq:liq,allC:f.dATH&&f.dWave&&f.dRev&&f.dSig,fundRate,fundAmt,fundDaily:fundAmt*3,slEff,rr};
}

function render(){
const{tab:T,totalVND:TV,spotPct:SP,rate:R}=state;
const FP=100-SP,spotVND=TV*SP/100,futVND=TV*FP/100,spotU=spotVND/R,futU=futVND/R,totalU=TV/R;
const sData=state.spots.map(calcSpot),fData=state.futures.map(calcFut);
const sPnL=sData.reduce((a,s)=>a+s.pnl,0),fPnL=fData.reduce((a,f)=>a+f.pnl,0),tPnL=sPnL+fPnL;
const maxFL=fData.reduce((a,f)=>a+f.slAmt,0);
const hW=state.history.filter(h=>h.pnl>0).length,hL=state.history.filter(h=>h.pnl<=0).length,hT=state.history.length;
const wr=hT>0?hW/hT*100:0;
const avgRR=hT>0?state.history.reduce((a,h)=>a+(h.rr||0),0)/hT:0;

let h=`<div class="header"><div class="header-row"><div><div class="logo">MAX<span>S</span><span class="logo-sub">Portfolio Manager v3</span></div><div class="subtitle">Quản trị danh mục đầu tư — An Niêm</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn-fetch" onclick="fetchPrices()" ${state.loading?'disabled':''}>${state.loading?'⏳ Đang tải...':'🔄 Cập nhật giá'}</button><button class="btn-fetch" style="background:#3b82f6" onclick="loadFromCloud()">☁️ Cloud</button><button class="btn-fetch" style="background:#10b981" onclick="exportData()">📥 Backup</button><button class="btn-fetch" style="background:#8b5cf6" onclick="importData()">📤 Import</button><span id="sync-badge" style="font-size:10px;color:#64748b">⏸</span>${state.lastFetch?`<span class="last-fetch">Giá: ${state.lastFetch}</span>`:''}</div></div></div>`;
h+=`<div class="tabs">${["dashboard","spot","future","lessons"].map(t=>`<button class="tab${T===t?' active':''}" onclick="state.tab='${t}';render()">${{dashboard:'📊 Dashboard',spot:'💎 Spot',future:'⚡ Future',lessons:'📝 Đúc kết'}[t]}</button>`).join('')}</div>`;
h+=`<div class="container">`;

if(T==="dashboard"){
h+=`<div class="grid grid-3"><div class="card"><label class="lbl">Tổng vốn (VND)</label><input type="number" value="${TV}" onchange="state.totalVND=Number(this.value)||0;render()"></div><div class="card"><label class="lbl">Spot %</label><input type="number" value="${SP}" onchange="state.spotPct=Number(this.value)||0;render()"></div><div class="card"><label class="lbl">Tỷ giá VND/USDT ${state.p2pRate?`<span style="color:#10b981">(P2P: ${fmt(state.p2pRate,0)}₫)</span>`:''}</label><input type="number" value="${R}" onchange="state.rate=Number(this.value)||0;render()"></div></div>`;

h+=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">`;
[[`Tổng vốn`,fV(TV),fU(totalU),'#3b82f6'],[`Spot ${SP}%`,fV(spotVND),fU(spotU),'#10b981'],[`Future ${FP}%`,fV(futVND),fU(futU),'#f59e0b'],['Tổng PnL',fU(tPnL),fV(tPnL*R),tPnL>=0?'#10b981':'#ef4444'],['Max Fut Loss',fU(maxFL),fV(maxFL*R),'#ef4444'],['Win Rate',hT>0?fP(wr):'—',`${hW}W/${hL}L/${hT}T`,'#8b5cf6'],['Avg R:R',avgRR>0?avgRR.toFixed(2):'—',`PnL: ${fU(state.history.reduce((a,x)=>a+x.pnl,0))}`,'#06b6d4']].forEach(([l,v,s,c])=>{
h+=`<div class="card card-kpi" style="--c:${c}"><div class="lbl">${l}</div><div class="val" style="color:${c}">${v}</div><div class="sub">${s}</div></div>`;
});
h+=`</div>`;

// WinRate per coin
const cs={};state.history.forEach(x=>{const k=`${x.coin}(${x.type==='Spot'?'S':'F'})`;if(!cs[k])cs[k]={w:0,l:0,pnl:0,rr:0,c:CC(x.coin)};if(x.pnl>0)cs[k].w++;else cs[k].l++;cs[k].pnl+=x.pnl;cs[k].rr+=(x.rr||0)});
if(Object.keys(cs).length>0){
h+=`<div class="card" style="margin-bottom:16px"><h3 style="font-size:13px;font-weight:700;margin-bottom:12px" class="orange">📊 Win Rate & R:R từng mã</h3><div style="overflow-x:auto"><table><thead><tr><th>Mã</th><th>Win</th><th>Loss</th><th>Win Rate</th><th>Avg R:R</th><th>PnL</th></tr></thead><tbody>`;
Object.entries(cs).forEach(([k,v])=>{const t=v.w+v.l;h+=`<tr><td style="font-weight:600;color:${v.c}">${k}</td><td class="green">${v.w}</td><td class="red">${v.l}</td><td style="color:${v.w/t>=.5?'#10b981':'#ef4444'}">${fP(v.w/t*100)}</td><td>${(v.rr/t).toFixed(2)}</td><td style="color:${v.pnl>=0?'#10b981':'#ef4444'};font-weight:700">${fU(v.pnl)}</td></tr>`});
h+=`</tbody></table></div></div>`;
}

h+=`<div class="grid grid-2">`;
h+=`<div class="card"><h3 style="font-size:13px;font-weight:700;margin-bottom:12px" class="orange">📊 Phân bổ</h3>`;

function sellSpot(i){const s=calcSpot(state.spots[i]);if(s.avg===0)return;const exit=s.sell>0?s.sell:s.cp;const pnl=s.qty*(exit-s.avg);const pnlPct=s.cost>0?(pnl/s.cost)*100:0;state.history.push({id:nid(),type:"Spot",coin:s.coin,entry:s.avg,exit,pnl,pnlPct,date:new Date().toLocaleDateString("vi-VN"),dir:"Long",rr:0,slEff:"good"});state.spots[i].st="Đã bán";render()}
function closeFut(i){const f=calcFut(state.futures[i]);if(f.entry===0)return;const exit=f.sell>0?f.sell:f.cp;const pnl=f.qty>0?f.qty*(exit-f.entry)*(f.dir==="Long"?1:-1):((exit-f.entry)/f.entry)*f.posSize*(f.dir==="Long"?1:-1);const pnlPct=f.capU>0?(pnl/f.capU)*100:0;const rr=f.sl>0&&f.tp>0?Math.abs(f.tp-f.entry)/Math.abs(f.entry-f.sl):0;state.history.push({id:nid(),type:"Future",coin:f.coin,entry:f.entry,exit,pnl,pnlPct,date:new Date().toLocaleDateString("vi-VN"),dir:f.dir,rr,slEff:pnl<0?"bad":"good"});state.futures[i].st="Đã đóng";render()}

function renderSyncBadge(){const el=document.getElementById("sync-badge");if(!el)return;el.style.color={idle:"#64748b",saving:"#f59e0b",loading:"#3b82f6",saved:"#10b981",error:"#ef4444"}[syncStatus];el.textContent={idle:"⏸",saving:"⏳",loading:"⏳",saved:`✅${lastSync||''}`,error:"❌"}[syncStatus]}
function exportData(){const d=JSON.stringify(state,null,2);const b=new Blob([d],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`MAXS_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u)}
function importData(){const inp=document.createElement("input");inp.type="file";inp.accept=".json";inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.spots)return alert("❌ Sai format");if(!confirm("⚠️ Ghi đè?"))return;Object.assign(state,d);state.loading=false;render();alert("✅ OK")}catch(er){alert("❌ "+er.message)}};r.readAsText(f)};inp.click()}
const origRender=render;render=function(){origRender();saveLocal();saveToCloud()};
loadLocal();render();
setTimeout(()=>{fetch(API_URL+"?action=load").then(r=>r.json()).then(d=>{if(d.success&&d.data&&(d.data.spots?.length>0||d.data.futures?.length>0)){if(d.data.settings){state.totalVND=Number(d.data.settings.totalVND)||state.totalVND;state.spotPct=Number(d.data.settings.spotPct)||state.spotPct;state.rate=Number(d.data.settings.rate)||state.rate}if(d.data.spots?.length>0)state.spots=d.data.spots;if(d.data.futures?.length>0)state.futures=d.data.futures;if(d.data.history)state.history=d.data.history;if(d.data.lessons)state.lessons=d.data.lessons;syncStatus="saved";lastSync=new Date().toLocaleTimeString("vi-VN");saveLocal();origRender();renderSyncBadge()}}).catch(()=>{})},500);
</script>
</body>
